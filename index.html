<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Moodle РЭУ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f4f7);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1c1c1e);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --btn: var(--tg-theme-button-color, #2ea6ff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --separator: rgba(60, 60, 67, 0.12);
      --success: #34c759;
      --danger: #ff3b30;
      --warning: #ff9f0a;
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }

    body {
      margin: 0;
      padding: 14px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
      min-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007aff, #5856d6);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
    }

    .user-name { font-size: 17px; font-weight: 600; margin: 0; }
    .user-status { font-size: 13px; color: var(--hint); margin: 0; }

    .header-btn {
      background: var(--card-bg);
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--btn);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .screen { display: none; animation: fadeIn 0.2s ease-in-out; }
    .screen.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      color: var(--hint);
      margin: 16px 6px 8px 6px;
      font-weight: 600;
      letter-spacing: -0.1px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .list-item {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.5px solid var(--separator);
      cursor: pointer;
      font-size: 16px;
    }

    .list-item:last-child { border-bottom: none; }
    .list-item:active { background: rgba(0,0,0,0.03); }

    .item-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.3;
      margin-right: 10px;
    }

    .arrow { color: var(--hint); font-size: 18px; }

    /* Размер 16px исключает неприятный автозум страницы в Safari на iPhone */
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--separator);
      border-radius: 10px;
      font-size: 16px;
      background: var(--card-bg);
      color: var(--text);
      margin-bottom: 12px;
      outline: none;
      -webkit-user-select: auto;
      user-select: auto;
    }

    .input-field:focus { border-color: var(--btn); }

    textarea.input-field {
      min-height: 80px;
      resize: vertical;
      font-family: inherit;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: var(--btn);
      color: var(--btn-text);
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-sub {
      background: none;
      border: none;
      color: var(--btn);
      font-size: 15px;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      margin-top: 4px;
    }

    .upload-box {
      border: 2px dashed var(--separator);
      border-radius: 12px;
      padding: 20px 14px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 14px;
      background: var(--card-bg);
    }

    .upload-box.has-file {
      border-color: var(--success);
      background: rgba(52, 199, 89, 0.05);
    }

    .file-name {
      font-weight: 600;
      color: var(--text);
      margin-top: 6px;
      word-break: break-all;
    }

    .loader {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner-center {
      text-align: center;
      padding: 40px 0;
      color: var(--hint);
    }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <div class="top-bar">
    <div class="user-info">
      <div class="avatar" id="avatarLetter">U</div>
      <div>
        <div class="user-name" id="userNameLabel">Moodle РЭУ</div>
        <div class="user-status" id="userStatusLabel">Подключение...</div>
      </div>
    </div>
    <button class="header-btn" onclick="refreshCourses()">🔄 Обновить</button>
  </div>

  <!-- ЭКРАН 1: ЗАГРУЗКА -->
  <div id="screenLoading" class="screen active">
    <div class="spinner-center">
      <div class="loader" style="border-top-color: var(--btn); border-color: rgba(0,0,0,0.1);"></div>
      <p style="margin-top: 14px;">Синхронизация с порталом РЭУ...</p>
    </div>
  </div>

  <!-- ЭКРАН 2: ВХОД В АККАУНТ -->
  <div id="screenLogin" class="screen">
    <div class="section-title">Авторизация study.rea.ru</div>
    <div class="card" style="padding: 16px;">
      <input type="text" id="loginInput" class="input-field" placeholder="Логин (например, Ivanov.II)" autocapitalize="none">
      <input type="password" id="passwordInput" class="input-field" placeholder="Пароль">
      <button class="btn-main" id="loginBtn" onclick="performLogin()">Войти в аккаунт</button>
    </div>
  </div>

  <!-- ЭКРАН 3: СПИСОК ПРЕДМЕТОВ -->
  <div id="screenCourses" class="screen">
    <div class="section-title">Твои предметы</div>
    <div class="card" id="coursesContainer"></div>
  </div>

  <!-- ЭКРАН 4: СПИСОК ЗАДАНИЙ -->
  <div id="screenTopics" class="screen">
    <div class="card" style="margin-bottom: 12px; cursor: pointer;" onclick="loadCourseGrades()">
      <div class="list-item" style="border: none;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 20px;">📊</span>
          <span style="font-weight: 600;">Журнал оценок и БРС</span>
        </div>
        <span class="arrow">›</span>
      </div>
    </div>

    <div class="section-title" id="topicsTitle">Задания курса</div>
    <div class="card" id="topicsContainer"></div>
    <button class="btn-sub" onclick="openScreen('screenCourses')">‹ Назад к курсам</button>
  </div>

  <!-- ЭКРАН 5: ЖУРНАЛ ОЦЕНОК И БРС -->
  <div id="screenGrades" class="screen">
    <div class="card" style="padding: 20px; text-align: center; background: linear-gradient(135deg, #1c1c1e, #2c2c2e); color: #fff;">
      <div style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.7;">Текущий балл БРС</div>
      <div id="gradesTotalNum" style="font-size: 42px; font-weight: 800; margin: 8px 0;">0</div>
      <div id="gradesStatusBadge" style="display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.15);">
        Считаем...
      </div>
    </div>

    <div class="section-title">История заданий и оценок</div>
    <div class="card" id="gradesListContainer"></div>
    <button class="btn-sub" onclick="openScreen('screenTopics')">‹ Назад к заданиям</button>
  </div>

  <!-- ЭКРАН 6: ДЕТАЛИ И СДАЧА РАБОТЫ -->
  <div id="screenDetails" class="screen">
    <div class="section-title">Материалы преподавателя</div>
    <div class="card" id="filesContainer" style="padding: 6px 14px;"></div>

    <div class="section-title">Твое решение</div>
    <div class="card" style="padding: 16px;">
      <textarea id="replyTextInput" class="input-field" placeholder="Комментарий к ответу (необязательно)"></textarea>

      <div class="upload-box" id="uploadBox" onclick="document.getElementById('filePicker').click()">
        <span style="font-size: 24px;">📎</span>
        <div id="uploadBoxText" style="margin-top: 6px; font-size: 14px; color: var(--hint);">
          Нажми, чтобы выбрать файл с решением
        </div>
        <div class="file-name" id="selectedFileName"></div>
      </div>
      <input type="file" id="filePicker" style="display: none;" onchange="handleFileSelected(event)">

      <button class="btn-main" id="submitWorkBtn" onclick="submitWork()">
        <span>Отправить на проверку</span>
      </button>
    </div>
    <button class="btn-sub" onclick="openScreen('screenTopics')">‹ Назад к темам</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyM6fNRDAmyTmQRiHhysGLCo3r5Gsyu5CWEQNkTEbYEZnXOSmd33iHXaig4s4Epmb5WDg/exec";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Защита от случайного свайпа вниз на iPhone и подтверждение закрытия при наборе
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();

    // Безопасное хранилище без падений в iframe на Telegram Web
    const safeStorage = {
      get: (key) => {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      },
      set: (key, val) => {
        try { localStorage.setItem(key, val); } catch (e) {}
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let authToken = urlParams.get('auth') || safeStorage.get('moodle_auth_token') || '';
    if (urlParams.get('auth')) {
      safeStorage.set('moodle_auth_token', urlParams.get('auth'));
    }

    let initData = tg.initData || '';

    let state = {
      courses: [],
      currentCourseId: null,
      currentTopicId: null,
      currentScreen: "screenLoading",
      selectedFileBlob: null,
      selectedFileName: ""
    };

    function getAuthParams() {
      const p = new URLSearchParams();
      if (initData) p.append('initData', initData);
      if (authToken) p.append('auth', authToken);
      return p.toString();
    }

    function notify(message) {
      if (tg.showAlert) {
        tg.showAlert(message);
      } else {
        alert(message);
      }
    }

    function openScreen(screenId) {
      state.currentScreen = screenId;
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      if (screenId === 'screenCourses' || screenId === 'screenLogin') {
        tg.BackButton.hide();
      } else {
        tg.BackButton.show();
      }
    }

    tg.BackButton.onClick(() => {
      if (state.currentScreen === 'screenDetails' || state.currentScreen === 'screenGrades') {
        openScreen('screenTopics');
      } else if (state.currentScreen === 'screenTopics') {
        openScreen('screenCourses');
      }
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function initApp() {
      openScreen('screenLoading');
      try {
        const resp = await fetch(`${API_URL}?action=init&${getAuthParams()}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        if (data.auth) {
          authToken = data.auth;
          safeStorage.set('moodle_auth_token', data.auth);
        }

        if (data.loggedIn) {
          document.getElementById('userNameLabel').textContent = data.login;
          document.getElementById('userStatusLabel').textContent = 'В сети';
          document.getElementById('avatarLetter').textContent = data.login[0].toUpperCase();
          renderCourses(data.courses);
          openScreen('screenCourses');
        } else {
          openScreen('screenLogin');
        }
      } catch (err) {
        document.getElementById('userStatusLabel').textContent = 'Ошибка связи';
        notify('Не удалось связаться с сервером. Нажми «Обновить».');
      }
    }

    async function performLogin() {
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('loginBtn');

      if (!login || !password) {
        notify('Заполни логин и пароль.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="loader"></div> Проверяю данные...';

      try {
        const resp = await fetch(`${API_URL}?action=login&${getAuthParams()}&login=${encodeURIComponent(login)}&password=${encodeURIComponent(password)}`);
        const data = await resp.json();

        if (data.success) {
          if (data.auth) {
            authToken = data.auth;
            safeStorage.set('moodle_auth_token', data.auth);
          }
          document.getElementById('userNameLabel').textContent = data.login;
          document.getElementById('userStatusLabel').textContent = 'В сети';
          document.getElementById('avatarLetter').textContent = data.login[0].toUpperCase();
          renderCourses(data.courses);
          openScreen('screenCourses');
        } else {
          notify('Ошибка входа: ' + (data.error || 'Проверь логин и пароль'));
        }
      } catch (e) {
        notify('Сбой соединения при авторизации.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Войти в аккаунт';
      }
    }

    function renderCourses(courses) {
      state.courses = courses;
      const container = document.getElementById('coursesContainer');
      container.innerHTML = '';

      if (!courses || courses.length === 0) {
        container.innerHTML = '<div style="padding: 16px; color: var(--hint); text-align: center;">Курсы не найдены.</div>';
        return;
      }

      courses.forEach(c => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `<span class="item-title">${escapeHtml(c.fullname)}</span><span class="arrow">›</span>`;
        div.onclick = () => loadTopics(c.id, c.fullname);
        container.appendChild(div);
      });
    }

    async function loadTopics(courseId, courseName) {
      state.currentCourseId = courseId;
      document.getElementById('topicsTitle').textContent = courseName;
      openScreen('screenLoading');

      try {
        const resp = await fetch(`${API_URL}?action=topics&${getAuthParams()}&courseId=${courseId}`);
        const data = await resp.json();

        const container = document.getElementById('topicsContainer');
        container.innerHTML = '';

        if (data.topics && data.topics.length > 0) {
          data.topics.forEach(t => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span class="item-title">📝 ${escapeHtml(t.name)}</span><span class="arrow">›</span>`;
            div.onclick = () => loadTopicDetails(t.id);
            container.appendChild(div);
          });
        } else {
          container.innerHTML = '<div style="padding: 16px; color: var(--hint); text-align: center;">Нет доступных тем обсуждений.</div>';
        }
        openScreen('screenTopics');
      } catch (e) {
        notify('Не удалось загрузить темы курса.');
        openScreen('screenCourses');
      }
    }

    async function loadCourseGrades() {
      openScreen('screenLoading');
      try {
        const resp = await fetch(`${API_URL}?action=course_grades&${getAuthParams()}&courseId=${state.currentCourseId}`);
        const data = await resp.json();

        if (data.success) {
          const total = parseFloat(data.total) || 0;
          const max = parseFloat(data.max) || 100;
          const percent = max > 0 ? (total / max) * 100 : 0;

          document.getElementById('gradesTotalNum').textContent = data.total;

          const badge = document.getElementById('gradesStatusBadge');
          if (percent >= 85) {
            badge.textContent = "Отлично / Автомат 🔥";
            badge.style.background = "#34c759";
          } else if (percent >= 60) {
            badge.textContent = "Зачет набран ✅";
            badge.style.background = "#30d158";
          } else {
            const need = Math.max(0, (max * 0.6) - total).toFixed(1);
            badge.textContent = `До зачета нужно еще ${need} б.`;
            badge.style.background = "#ff9f0a";
          }

          const container = document.getElementById('gradesListContainer');
          container.innerHTML = '';

          if (data.items && data.items.length > 0) {
            data.items.forEach(it => {
              const div = document.createElement('div');
              div.className = 'list-item';
              div.style.flexDirection = 'column';
              div.style.alignItems = 'flex-start';
              div.style.gap = '4px';

              const feedbackHtml = it.feedback 
                ? `<div style="font-size: 13px; color: var(--hint); background: rgba(0,0,0,0.03); padding: 6px 10px; border-radius: 8px; width: 100%; margin-top: 4px;">💬 ${escapeHtml(it.feedback)}</div>` 
                : '';

              const gradeColor = it.grade === "Не оценено" ? "var(--hint)" : "var(--btn)";

              div.innerHTML = `
                <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                  <span class="item-title" style="font-size: 14px;">${escapeHtml(it.name)}</span>
                  <span style="font-weight: 700; color: ${gradeColor}; font-size: 14px;">${escapeHtml(it.grade)}</span>
                </div>
                ${feedbackHtml}
              `;
              container.appendChild(div);
            });
          } else {
            container.innerHTML = '<div style="padding: 16px; color: var(--hint); text-align: center;">В журнале пока нет данных.</div>';
          }

          openScreen('screenGrades');
        } else {
          notify('Не удалось прочитать оценки: ' + data.error);
          openScreen('screenTopics');
        }
      } catch (e) {
        notify('Ошибка связи с сервером при запросе оценок.');
        openScreen('screenTopics');
      }
    }

    async function loadTopicDetails(topicId) {
      state.currentTopicId = topicId;
      openScreen('screenLoading');

      try {
        const resp = await fetch(`${API_URL}?action=topic_details&${getAuthParams()}&topicId=${topicId}`);
        const data = await resp.json();

        const filesContainer = document.getElementById('filesContainer');
        filesContainer.innerHTML = '';

        if (data.details.files && data.details.files.length > 0) {
          data.details.files.forEach(f => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.style.padding = '12px 0';
            div.innerHTML = `
              <span class="item-title" style="font-size: 14px;">📄 ${escapeHtml(f.name)}</span>
              <button class="header-btn" style="padding: 6px 10px; font-size: 13px;">📥 В чат</button>
            `;
            div.querySelector('button').onclick = (e) => {
              e.stopPropagation();
              sendTeacherFileToChat(f.url, f.name);
            };
            filesContainer.appendChild(div);
          });
        } else {
          filesContainer.innerHTML = '<div style="padding: 10px 0; color: var(--hint); font-size: 14px;">Преподаватель не прикрепил файлов к теме.</div>';
        }

        document.getElementById('replyTextInput').value = '';
        state.selectedFileBlob = null;
        state.selectedFileName = '';
        document.getElementById('selectedFileName').textContent = '';
        document.getElementById('uploadBox').classList.remove('has-file');
        document.getElementById('uploadBoxText').textContent = 'Нажми, чтобы выбрать файл с решением';

        openScreen('screenDetails');
      } catch (e) {
        notify('Не удалось открыть задание.');
        openScreen('screenTopics');
      }
    }

    async function sendTeacherFileToChat(url, name) {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
      try {
        const resp = await fetch(`${API_URL}?action=send_file&${getAuthParams()}&fileUrl=${encodeURIComponent(url)}&fileName=${encodeURIComponent(name)}`);
        const data = await resp.json();
        if (data.success) {
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          notify(`Файл «${name}» отправлен в личный чат с ботом!`);
        } else {
          notify('Ошибка: ' + (data.error || 'Не удалось отправить файл'));
        }
      } catch (e) {
        notify('Ошибка при отправке файла в чат.');
      }
    }

    function handleFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 15 * 1024 * 1024) {
        notify('Файл превышает 15 МБ. Сожми его перед отправкой.');
        return;
      }

      state.selectedFileName = file.name;
      const reader = new FileReader();

      reader.onload = function(event) {
        state.selectedFileBlob = event.target.result.split(',')[1];
        document.getElementById('selectedFileName').textContent = file.name;
        document.getElementById('uploadBoxText').textContent = 'Файл выбран:';
        document.getElementById('uploadBox').classList.add('has-file');
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      };
      reader.readAsDataURL(file);
    }

    async function submitWork() {
      if (!state.selectedFileBlob) {
        notify('Пожалуйста, выбери файл с решением.');
        return;
      }

      const text = document.getElementById('replyTextInput').value.trim() || 'Выполненная работа';
      const btn = document.getElementById('submitWorkBtn');

      btn.disabled = true;
      btn.innerHTML = '<div class="loader"></div> Отправляю в Moodle...';

      const payload = {
        action: 'submit_work',
        initData: initData,
        auth: authToken,
        topicId: state.currentTopicId,
        text: text,
        fileName: state.selectedFileName,
        fileBase64: state.selectedFileBlob
      };

      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const res = await resp.json();
        if (res.success) {
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          notify('Работа успешно сдана на портал РЭУ!');
          openScreen('screenTopics');
        } else {
          notify('Ошибка сдачи: ' + res.error);
        }
      } catch (e) {
        notify('Сбой при отправке работы. Проверь сеть.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Отправить на проверку</span>';
      }
    }

    function refreshCourses() {
      initApp();
    }

    initApp();
  </script>
</body>
</html>
