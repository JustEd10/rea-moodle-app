<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Moodle РЭУ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1115);
      --card-bg: var(--tg-theme-secondary-bg-color, #1a1d24);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8e95a3);
      --btn: var(--tg-theme-button-color, #2ea6ff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --separator: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.06);
      --success: #34c759;
      --danger: #ff453a;
      --warning: #ff9f0a;
      --accent-gradient: linear-gradient(135deg, #007aff, #5856d6);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --separator: rgba(0, 0, 0, 0.08);
        --card-border: rgba(0, 0, 0, 0.04);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 16px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
      min-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 4px 2px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--accent-gradient);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 17px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
    }

    .user-name { font-size: 17px; font-weight: 700; margin: 0; }
    .user-status { font-size: 13px; color: var(--hint); margin: 2px 0 0 0; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 12px;
      color: var(--btn);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .header-btn:active { transform: scale(0.94); opacity: 0.8; }
    .header-btn.danger { color: var(--danger); }

    .screen { 
      display: none; 
      opacity: 0; 
      transform: translateY(10px);
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .screen.active { 
      display: block; 
      opacity: 1; 
      transform: translateY(0);
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--hint);
      margin: 20px 6px 10px 6px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(10px);
    }

    .list-item {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.5px solid var(--separator);
      cursor: pointer;
      font-size: 15px;
      transition: background-color 0.15s ease, transform 0.15s ease;
      animation: itemFadeIn 0.3s ease backwards;
    }

    @keyframes itemFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .list-item:last-child { border-bottom: none; }
    .list-item:active { background: rgba(125, 125, 125, 0.08); transform: scale(0.99); }

    .item-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      margin-right: 12px;
      word-break: break-word;
    }

    .arrow { color: var(--hint); font-size: 18px; font-weight: 600; opacity: 0.6; }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      font-size: 16px;
      background: rgba(125, 125, 125, 0.05);
      color: var(--text);
      margin-bottom: 12px;
      outline: none;
      -webkit-user-select: auto;
      user-select: auto;
    }

    .input-field:focus { 
      border-color: var(--btn);
      box-shadow: 0 0 0 3px rgba(46, 166, 255, 0.15);
    }

    textarea.input-field { min-height: 90px; resize: vertical; font-family: inherit; }

    .btn-main {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      background: var(--btn);
      color: var(--btn-text);
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(46, 166, 255, 0.3);
      transition: transform 0.15s ease;
    }

    .btn-main:active { transform: scale(0.97); }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-sub {
      background: none;
      border: none;
      color: var(--btn);
      font-size: 15px;
      font-weight: 600;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      margin-top: 4px;
    }

    .upload-box {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
      background: rgba(125, 125, 125, 0.03);
    }

    .upload-box.has-file {
      border-color: var(--success);
      background: rgba(52, 199, 89, 0.08);
      border-style: solid;
    }

    .file-name { font-weight: 600; color: var(--text); margin-top: 8px; font-size: 14px; word-break: break-all; }

    .brs-banner {
      padding: 24px 20px;
      text-align: center;
      background: linear-gradient(135deg, #181b22, #242933);
      color: #fff;
      border-radius: 20px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brs-score {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
      margin: 6px 0;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
    }

    .brs-score span { font-size: 20px; font-weight: 600; opacity: 0.6; }

    .progress-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      margin: 18px 0 10px 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      border-radius: 20px;
      transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .progress-markers {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--hint);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 6px;
      background: rgba(255, 255, 255, 0.12);
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .skeleton-item {
      padding: 18px;
      border-bottom: 0.5px solid var(--separator);
      display: flex;
      align-items: center;
    }

    .skeleton-line {
      height: 16px;
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(125,125,125,0.08) 25%, rgba(125,125,125,0.18) 50%, rgba(125,125,125,0.08) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite ease-in-out;
    }

    .loader-mini {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <div class="top-bar">
    <div class="user-info">
      <div class="avatar" id="avatarLetter">🎓</div>
      <div>
        <div class="user-name" id="userNameLabel">Moodle РЭУ</div>
        <div class="user-status" id="userStatusLabel">Синхронизация...</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="refreshCourses()">🔄</button>
      <button class="header-btn danger" id="logoutHeaderBtn" style="display: none;" onclick="performLogout()">🚪</button>
    </div>
  </div>

  <!-- ЭКРАН 1: СКЕЛЕТОН ЗАГРУЗКИ -->
  <div id="screenLoading" class="screen active">
    <div class="section-title">Загрузка данных...</div>
    <div class="card">
      <div class="skeleton-item"><div class="skeleton-line" style="width: 75%;"></div></div>
      <div class="skeleton-item"><div class="skeleton-line" style="width: 60%;"></div></div>
      <div class="skeleton-item"><div class="skeleton-line" style="width: 85%;"></div></div>
      <div class="skeleton-item"><div class="skeleton-line" style="width: 50%;"></div></div>
    </div>
  </div>

  <!-- ЭКРАН 2: ВХОД В АККАУНТ -->
  <div id="screenLogin" class="screen">
    <div class="section-title">Авторизация study.rea.ru</div>
    <div class="card" style="padding: 20px;">
      <input type="text" id="loginInput" class="input-field" placeholder="Логин (например, Ivanov.II)" autocapitalize="none">
      <input type="password" id="passwordInput" class="input-field" placeholder="Пароль">
      <button class="btn-main" id="loginBtn" onclick="performLogin()">Войти в аккаунт</button>
    </div>
  </div>

  <!-- ЭКРАН 3: СПИСОК ПРЕДМЕТОВ -->
  <div id="screenCourses" class="screen">
    <div class="section-title">Твои дисциплины</div>
    <div class="card" id="coursesContainer"></div>
  </div>

  <!-- ЭКРАН 4: СПИСОК ЗАДАНИЙ -->
  <div id="screenTopics" class="screen">
    <div class="card" style="margin-bottom: 14px; cursor: pointer;" onclick="loadCourseGrades()">
      <div class="list-item" style="border: none;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 22px;">📊</span>
          <span style="font-weight: 700; font-size: 16px;">Журнал оценок и БРС</span>
        </div>
        <span class="arrow">›</span>
      </div>
    </div>

    <div class="section-title" id="topicsTitle">Задания курса</div>
    <div class="card" id="topicsContainer"></div>
    <button class="btn-sub" onclick="openScreen('screenCourses')">‹ Назад к предметам</button>
  </div>

  <!-- ЭКРАН 5: ЖУРНАЛ ОЦЕНОК И БРС -->
  <div id="screenGrades" class="screen">
    <div class="brs-banner">
      <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.7; font-weight: 700;">
        Текущий рейтинг БРС
      </div>
      <div class="brs-score">
        <span id="gradesTotalNum">0</span>
        <span id="gradesTotalMax">/ 100</span>
      </div>
      
      <div class="progress-track">
        <div class="progress-fill" id="gradesProgressBar"></div>
      </div>
      <div class="progress-markers">
        <span>0</span>
        <span>60 (зачет)</span>
        <span>85 (автомат)</span>
        <span>100</span>
      </div>

      <div style="margin-top: 14px;">
        <div class="status-badge" id="gradesStatusBadge">Подсчет баллов...</div>
      </div>
    </div>

    <div class="section-title">Ведомость заданий</div>
    <div class="card" id="gradesListContainer"></div>
    <button class="btn-sub" onclick="openScreen('screenTopics')">‹ Назад к курсу</button>
  </div>

  <!-- ЭКРАН 6: ДЕТАЛИ И СДАЧА РАБОТЫ -->
  <div id="screenDetails" class="screen">
    <div class="section-title">Материалы преподавателя</div>
    <div class="card" id="filesContainer" style="padding: 6px 16px;"></div>

    <div class="section-title">Отправка решения</div>
    <div class="card" style="padding: 18px;">
      <textarea id="replyTextInput" class="input-field" placeholder="Комментарий к работе (необязательно)"></textarea>

      <div class="upload-box" id="uploadBox" onclick="document.getElementById('filePicker').click()">
        <span style="font-size: 28px;">📄</span>
        <div id="uploadBoxText" style="margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--hint);">
          Нажми, чтобы прикрепить файл
        </div>
        <div class="file-name" id="selectedFileName"></div>
      </div>
      <input type="file" id="filePicker" style="display: none;" onchange="handleFileSelected(event)">

      <button class="btn-main" id="submitWorkBtn" onclick="submitWork()">
        <span>Отправить на проверку</span>
      </button>
    </div>
    <button class="btn-sub" onclick="openScreen('screenTopics')">‹ Назад к заданиям</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyM6fNRDAmyTmQRiHhysGLCo3r5Gsyu5CWEQNkTEbYEZnXOSmd33iHXaig4s4Epmb5WDg/exec";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();

    const safeStorage = {
      get: (key) => {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      },
      set: (key, val) => {
        try { localStorage.setItem(key, val); } catch (e) {}
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let authToken = urlParams.get('auth') || safeStorage.get('moodle_auth_token') || '';
    if (urlParams.get('auth')) {
      safeStorage.set('moodle_auth_token', urlParams.get('auth'));
    }

    let initData = tg.initData || '';

    let state = {
      courses: [],
      currentCourseId: null,
      currentTopicId: null,
      currentScreen: "screenLoading",
      selectedFileBlob: null,
      selectedFileName: ""
    };

    function triggerHaptic(type) {
      if (!tg.HapticFeedback) return;
      if (type === 'light') tg.HapticFeedback.impactOccurred('light');
      if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    }

    function getAuthParams() {
      const p = new URLSearchParams();
      if (initData) p.append('initData', initData);
      if (authToken) p.append('auth', authToken);
      return p.toString();
    }

    function notify(message) {
      if (tg.showAlert) {
        tg.showAlert(message);
      } else {
        alert(message);
      }
    }

    function openScreen(screenId) {
      state.currentScreen = screenId;
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      
      const target = document.getElementById(screenId);
      target.classList.add('active');

      triggerHaptic('light');

      if (screenId === 'screenCourses' || screenId === 'screenLogin') {
        tg.BackButton.hide();
      } else {
        tg.BackButton.show();
      }
    }

    tg.BackButton.onClick(() => {
      triggerHaptic('light');
      if (state.currentScreen === 'screenDetails' || state.currentScreen === 'screenGrades') {
        openScreen('screenTopics');
      } else if (state.currentScreen === 'screenTopics') {
        openScreen('screenCourses');
      }
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function initApp() {
      openScreen('screenLoading');
      try {
        const resp = await fetch(`${API_URL}?action=init&${getAuthParams()}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        if (data.auth) {
          authToken = data.auth;
          safeStorage.set('moodle_auth_token', data.auth);
        }

        if (data.loggedIn) {
          document.getElementById('userNameLabel').textContent = data.login;
          document.getElementById('userStatusLabel').textContent = 'В сети';
          document.getElementById('avatarLetter').textContent = data.login[0].toUpperCase();
          document.getElementById('logoutHeaderBtn').style.display = 'flex';
          renderCourses(data.courses);
          openScreen('screenCourses');
        } else {
          document.getElementById('logoutHeaderBtn').style.display = 'none';
          openScreen('screenLogin');
        }
      } catch (err) {
        document.getElementById('userStatusLabel').textContent = 'Ошибка связи';
        notify('Не удалось связаться с сервером. Нажми «Обновить».');
      }
    }

    async function performLogin() {
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('loginBtn');

      if (!login || !password) {
        notify('Заполни логин и пароль.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="loader-mini"></div> Проверяю данные...';

      try {
        const resp = await fetch(`${API_URL}?action=login&${getAuthParams()}&login=${encodeURIComponent(login)}&password=${encodeURIComponent(password)}`);
        const data = await resp.json();

        if (data.success) {
          triggerHaptic('success');
          if (data.auth) {
            authToken = data.auth;
            safeStorage.set('moodle_auth_token', data.auth);
          }
          document.getElementById('userNameLabel').textContent = data.login;
          document.getElementById('userStatusLabel').textContent = 'В сети';
          document.getElementById('avatarLetter').textContent = data.login[0].toUpperCase();
          document.getElementById('logoutHeaderBtn').style.display = 'flex';
          renderCourses(data.courses);
          openScreen('screenCourses');
        } else {
          triggerHaptic('error');
          notify('Ошибка входа: ' + (data.error || 'Проверь логин и пароль'));
        }
      } catch (e) {
        triggerHaptic('error');
        notify('Сбой соединения при авторизации.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Войти в аккаунт';
      }
    }

    async function performLogout() {
      const confirmLogout = confirm('Выйти из аккаунта study.rea.ru?');
      if (!confirmLogout) return;

      triggerHaptic('medium');
      openScreen('screenLoading');

      try {
        await fetch(`${API_URL}?action=logout&${getAuthParams()}`);
      } catch (e) {}

      authToken = '';
      safeStorage.set('moodle_auth_token', '');
      document.getElementById('userNameLabel').textContent = 'Moodle РЭУ';
      document.getElementById('userStatusLabel').textContent = 'Не авторизован';
      document.getElementById('avatarLetter').textContent = '🎓';
      document.getElementById('logoutHeaderBtn').style.display = 'none';
      document.getElementById('loginInput').value = '';
      document.getElementById('passwordInput').value = '';

      openScreen('screenLogin');
    }

    function renderCourses(courses) {
      state.courses = courses;
      const container = document.getElementById('coursesContainer');
      container.innerHTML = '';

      if (!courses || courses.length === 0) {
        container.innerHTML = '<div style="padding: 24px; color: var(--hint); text-align: center; font-weight: 500;">Курсы не найдены.</div>';
        return;
      }

      courses.forEach((c, index) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.style.animationDelay = `${index * 0.04}s`;
        div.innerHTML = `
          <span class="item-title">${escapeHtml(c.fullname)}</span>
          <span class="arrow">›</span>
        `;
        div.onclick = () => loadTopics(c.id, c.fullname);
        container.appendChild(div);
      });
    }

    async function loadTopics(courseId, courseName) {
      state.currentCourseId = courseId;
      document.getElementById('topicsTitle').textContent = courseName;
      openScreen('screenLoading');

      try {
        const resp = await fetch(`${API_URL}?action=topics&${getAuthParams()}&courseId=${courseId}`);
        const data = await resp.json();

        const container = document.getElementById('topicsContainer');
        container.innerHTML = '';

        if (data.topics && data.topics.length > 0) {
          data.topics.forEach((t, index) => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.style.animationDelay = `${index * 0.04}s`;
            div.innerHTML = `
              <span class="item-title">📝 ${escapeHtml(t.name)}</span>
              <span class="arrow">›</span>
            `;
            div.onclick = () => loadTopicDetails(t.id);
            container.appendChild(div);
          });
        } else {
          container.innerHTML = '<div style="padding: 24px; color: var(--hint); text-align: center;">В этом курсе нет активных заданий.</div>';
        }
        openScreen('screenTopics');
      } catch (e) {
        notify('Не удалось загрузить темы курса.');
        openScreen('screenCourses');
      }
    }

    async function loadCourseGrades() {
      openScreen('screenLoading');
      try {
        const resp = await fetch(`${API_URL}?action=course_grades&${getAuthParams()}&courseId=${state.currentCourseId}`);
        const data = await resp.json();

        if (data.success) {
          const total = parseFloat(data.total) || 0;
          const max = parseFloat(data.max) || 100;
          const percent = Math.min(100, Math.max(0, max > 0 ? (total / max) * 100 : 0));

          document.getElementById('gradesTotalNum').textContent = data.total;
          document.getElementById('gradesTotalMax').textContent = `/ ${data.max}`;

          setTimeout(() => {
            document.getElementById('gradesProgressBar').style.width = `${percent}%`;
          }, 50);

          const badge = document.getElementById('gradesStatusBadge');
          if (percent >= 85) {
            badge.innerHTML = '🔥 Отлично (Автомат)';
            badge.style.background = 'rgba(52, 199, 89, 0.2)';
            badge.style.color = '#34c759';
          } else if (percent >= 60) {
            badge.innerHTML = '✅ Зачет набран';
            badge.style.background = 'rgba(46, 166, 255, 0.2)';
            badge.style.color = '#2ea6ff';
          } else {
            const need = Math.max(0, (max * 0.6) - total).toFixed(1);
            badge.innerHTML = `⚡ До зачета нужно: ${need} б.`;
            badge.style.background = 'rgba(255, 159, 10, 0.2)';
            badge.style.color = '#ff9f0a';
          }

          const container = document.getElementById('gradesListContainer');
          container.innerHTML = '';

          if (data.items && data.items.length > 0) {
            data.items.forEach((it, index) => {
              const div = document.createElement('div');
              div.className = 'list-item';
              div.style.flexDirection = 'column';
              div.style.alignItems = 'flex-start';
              div.style.gap = '6px';
              div.style.animationDelay = `${index * 0.03}s`;

              const feedbackHtml = it.feedback 
                ? `<div style="font-size: 13px; color: var(--hint); background: rgba(125,125,125,0.06); padding: 8px 12px; border-radius: 10px; width: 100%; margin-top: 4px; line-height: 1.35;">💬 ${escapeHtml(it.feedback)}</div>` 
                : '';

              const gradeColor = it.grade === "Не оценено" ? "var(--hint)" : "var(--btn)";

              div.innerHTML = `
                <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                  <span class="item-title" style="font-size: 14px;">${escapeHtml(it.name)}</span>
                  <span style="font-weight: 700; color: ${gradeColor}; font-size: 15px;">${escapeHtml(it.grade)}</span>
                </div>
                ${feedbackHtml}
              `;
              container.appendChild(div);
            });
          } else {
            container.innerHTML = '<div style="padding: 24px; color: var(--hint); text-align: center;">В журнале пока нет данных.</div>';
          }

          openScreen('screenGrades');
        } else {
          notify('Не удалось прочитать оценки: ' + data.error);
          openScreen('screenTopics');
        }
      } catch (e) {
        notify('Ошибка связи с сервером при запросе оценок.');
        openScreen('screenTopics');
      }
    }

    async function loadTopicDetails(topicId) {
      state.currentTopicId = topicId;
      openScreen('screenLoading');

      try {
        const resp = await fetch(`${API_URL}?action=topic_details&${getAuthParams()}&topicId=${topicId}`);
        const data = await resp.json();

        const filesContainer = document.getElementById('filesContainer');
        filesContainer.innerHTML = '';

        if (data.details.files && data.details.files.length > 0) {
          data.details.files.forEach(f => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.style.padding = '12px 0';
            div.innerHTML = `
              <span class="item-title" style="font-size: 14px;">📄 ${escapeHtml(f.name)}</span>
              <button class="header-btn" style="padding: 6px 12px; font-size: 13px;">📥 В чат</button>
            `;
            div.querySelector('button').onclick = (e) => {
              e.stopPropagation();
              sendTeacherFileToChat(f.url, f.name);
            };
            filesContainer.appendChild(div);
          });
        } else {
          filesContainer.innerHTML = '<div style="padding: 12px 0; color: var(--hint); font-size: 14px;">Преподаватель не прикрепил файлов к теме.</div>';
        }

        document.getElementById('replyTextInput').value = '';
        state.selectedFileBlob = null;
        state.selectedFileName = '';
        document.getElementById('selectedFileName').textContent = '';
        document.getElementById('uploadBox').classList.remove('has-file');
        document.getElementById('uploadBoxText').textContent = 'Нажми, чтобы прикрепить файл';

        openScreen('screenDetails');
      } catch (e) {
        notify('Не удалось открыть задание.');
        openScreen('screenTopics');
      }
    }

    async function sendTeacherFileToChat(url, name) {
      triggerHaptic('medium');
      try {
        const resp = await fetch(`${API_URL}?action=send_file&${getAuthParams()}&fileUrl=${encodeURIComponent(url)}&fileName=${encodeURIComponent(name)}`);
        const data = await resp.json();
        if (data.success) {
          triggerHaptic('success');
          notify(`Файл «${name}» отправлен в личный чат с ботом!`);
        } else {
          notify('Ошибка: ' + (data.error || 'Не удалось отправить файл'));
        }
      } catch (e) {
        notify('Ошибка при отправке файла в чат.');
      }
    }

    function handleFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 15 * 1024 * 1024) {
        triggerHaptic('error');
        notify('Файл превышает 15 МБ. Сожми его перед отправкой.');
        return;
      }

      state.selectedFileName = file.name;
      const reader = new FileReader();

      reader.onload = function(event) {
        state.selectedFileBlob = event.target.result.split(',')[1];
        document.getElementById('selectedFileName').textContent = file.name;
        document.getElementById('uploadBoxText').textContent = 'Файл прикреплен:';
        document.getElementById('uploadBox').classList.add('has-file');
        triggerHaptic('medium');
      };
      reader.readAsDataURL(file);
    }

    async function submitWork() {
      if (!state.selectedFileBlob) {
        triggerHaptic('error');
        notify('Пожалуйста, прикрепи файл с решением.');
        return;
      }

      const text = document.getElementById('replyTextInput').value.trim() || 'Выполненная работа';
      const btn = document.getElementById('submitWorkBtn');

      btn.disabled = true;
      btn.innerHTML = '<div class="loader-mini"></div> Отправляю в Moodle...';

      const payload = {
        action: 'submit_work',
        initData: initData,
        auth: authToken,
        topicId: state.currentTopicId,
        text: text,
        fileName: state.selectedFileName,
        fileBase64: state.selectedFileBlob
      };

      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const res = await resp.json();
        if (res.success) {
          triggerHaptic('success');
          notify('Работа успешно сдана на портал РЭУ!');
          openScreen('screenTopics');
        } else {
          triggerHaptic('error');
          notify('Ошибка сдачи: ' + res.error);
        }
      } catch (e) {
        triggerHaptic('error');
        notify('Сбой при отправке работы. Проверь сеть.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Отправить на проверку</span>';
      }
    }

    function refreshCourses() {
      triggerHaptic('medium');
      initApp();
    }

    initApp();
  </script>
</body>
</html>
